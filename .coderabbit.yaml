# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  merge_risk_instructions: |
    Every change in db/migrations runs on production data and is rolled back by hand.
    Rate any pull request that touches db/migrations at least Moderate.
  auto_review:
    enabled: true
  auto_approvals:
    enabled: true
    max_merge_risk: low
    overrides:
      - paths: ["src/auth/**"]
        enabled: false
